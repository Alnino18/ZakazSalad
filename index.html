<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Заказ салатов</title>

    <!-- Иконка ва Манифест (ХАТОЛАР ТУЗАТИЛДИ) -->
    <link rel="icon" type="image/png" href="icon.png?v=3">
    <link rel="apple-touch-icon" href="icon.png?v=3">
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'TeeGu zakaz',
        'short_name': 'TeeGu',
        'start_url': 'https://alnino18.github.io/ZakazSalad/index.html,
        'display': 'standalone',
        'background_color': '#ffffff',
        'theme_color': '#27ae60',
        'icons': [{'src': 'icon.png', 'sizes': '512x512', 'type': 'image/png'}]
    }">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: -apple-system, sans-serif; background: #F2F2F7; margin: 0; padding-bottom: 100px; }
        
        /* Логотип услуби */
        .header-container { text-align: center; padding: 20px 0; background-color: #ffffff; border-bottom: 2px solid #27ae60; margin-bottom: 10px; }
        .main-logo { max-width: 200px; height: auto; display: block; margin: 0 auto; }

        .header { background: #fff; padding: 12px; position: sticky; top: 0; border-bottom: 1px solid #ccc; z-index: 100; }
        .shop-select, .search-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }

        .row { display: flex; align-items: center; padding: 12px; background: #fff; border-bottom: 0.5px solid #eee; }
        .name { flex: 2; font-size: 16px; font-weight: 500; }
        .inputs { flex: 1.8; display: flex; gap: 5px; }
        .inputs input { width: 65px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; background: #F9F9F9; }
        
        .footer { position: fixed; bottom: 0; width: 100%; padding: 15px; background: rgba(255,255,255,0.9); border-top: 1px solid #ccc; }
        .btn-send { width: 100%; background: #0088cc; color: #fff; border: none; border-radius: 12px; padding: 18px; font-size: 18px; font-weight: bold; }

        #pdf-template { position: absolute; left: -9999px; width: 500px; background: white; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        td { border: 1px solid #000; padding: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="header-container">
    <!-- logo.png Гитҳабда борлигига ишонч ҳосил қилинг -->
    <img src="logo.png" alt="Logo" class="main-logo">
</div>

<div class="header">
    <select id="shop" class="shop-select">
        <option>Аския Бозор</option>
        <option>Эко Бозор</option>
        <option>Сергили Бозор</option>
        <option>Сергили Ярмарка</option>
    </select>
    <input type="text" id="search" class="search-box" placeholder="Қидириш..." oninput="filterRows()">
</div>

<div id="mainList"></div>

<!-- Telegramga yuborish uchun PDF shablon -->
<div id="pdf-template">
    <div id="pdf-shop-name" style="text-align:center; font-weight:bold; margin-bottom:10px;"></div>
    <table><tbody id="pdf-body"></tbody></table>
</div>

<div class="footer">
    <button class="btn-send" id="btn" onclick="sendOrder()">ОТПРАВИТЬ</button>
</div>

<script>
    // JavaScript қисми ўзгаришсиз қолди
    const BOT_TOKEN = '8691293032:AAGikZsTLffxhHo3_RVCRK3Ol7--oXPIaF8'; 
    const CHAT_ID = '483325961'; 
    const salats = ["Ашланфу", "Баклажан перец жареный", "Баклажаны кабачки", "Баклажаны маринованные", "Баклажаны соте", "Баклажаны сухие", "Винегрет", "Витаминка", "Грибное ассорти", "Грибы древесные", "Грибы жареные", "Грибы маринованные", "Грибы шампиньоны", "Грибы шитаки", "Капуста сладкая", "Кочи нипи", "Креветки", "Лечо", "Марковча", "Марковча не крашенная", "Маш", "Морская капуста", "Огурцы", "Перец жареный", "Свёкла", "Соя мясо", "Спаржа", "Стрелки", "Тиби", "Тофу салат", "Фаршированный перец", "Фунчоза", "Хе куриное", "Хе мясное", "Хе рыба", "Хе три буха", "Галовка капуста", "Шпинат", "Армянский капуста", "Дайкон маринованный", "Дайкон салат", "Зверобой", "Капуста кимчи", "Квашеная капуста сладкая", "Маринованный огурцы", "Маринованный помидор", "Редиска чимчи", "Солёные ассорти", "Солёные огурцы", "Солёные памидор", "Чеснок маринованный", "Чимчи", "Женский каприз", "Крабовые", "Мужской каприз", "Оливье", "Чартоги", "Варенка", "Горчица", "Лозижон", "Маченка", "Нори Большой", "Нори Маленький", "Пигodя крахмальные", "Пигodя рисовый", "Спаржа сухая", "Халапено", "Тирой", "Борсик йог", "Гоз йог", "Цяй жареный", "Уксус", "Фунчоза сухая", "Чинпени", "Чипс", "Кукси", "Малосольные огурцы"];

    function renderList() {
        const container = document.getElementById('mainList');
        container.innerHTML = salats.map((name, i) => `
            <div class="row" data-n="${name.toLowerCase()}">
                <div class="name">${name}</div>
                <div class="inputs">
                    <input type="number" id="q-${i}" class="q-in" placeholder="0">
                </div>
            </div>
        `).join('');
    }
    
    function filterRows() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.row').forEach(r => r.style.display = r.getAttribute('data-n').includes(val) ? 'flex' : 'none');
    }

    async function sendOrder() {
        const shop = document.getElementById('shop').value;
        const pdfBody = document.getElementById('pdf-body');
        pdfBody.innerHTML = "";
        let count = 0;
        salats.forEach((name, i) => {
            let q = document.getElementById(`q-${i}`).value;
            if (q > 0) { count++; pdfBody.innerHTML += `<tr><td>${name}</td><td>${q}</td></tr>`; }
        });
        if (count === 0) return alert("Миқдор киритинг!");
        document.getElementById('pdf-shop-name').innerText = shop;
        
        const canvas = await html2canvas(document.getElementById('pdf-template'), { scale: 3 });
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
            alert("Заказ юборилди!");
        }, 'image/png');
    }
    renderList();
</script>
</body>
</html>
