<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="manifest" href="data:application/manifest+json,{"display":"standalone","start_url":"/","name":"TeeGu zakaz"}">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

    <title>Заказ салатов</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: -apple-system, sans-serif; background: #F2F2F7; margin: 0; padding-bottom: 100px; }
        .header { background: #fff; padding: 12px; position: sticky; top: 0; border-bottom: 1px solid #ccc; z-index: 100; }
        .shop-select, .search-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; outline: none; }
        
        .row { display: flex; align-items: center; padding: 12px; background: #fff; border-bottom: 0.5px solid #eee; }
        .name { flex: 2; font-size: 16px; font-weight: 500; }
        .inputs { flex: 1.8; display: flex; gap: 5px; }
        .inputs input { width: 65px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; background: #F9F9F9; }
        .inputs select { padding: 9px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 14px; }
        
        .footer { position: fixed; bottom: 0; width: 100%; padding: 15px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-top: 1px solid #ccc; box-sizing: border-box; }
        .btn-send { width: 100%; background: #0088cc; color: #fff; border: none; border-radius: 12px; padding: 18px; font-size: 18px; font-weight: bold; }

        /* РАСМ ШАБЛОНИ */
        #pdf-template { 
            position: absolute; left: -9999px; 
            width: 500px; background: white; padding: 20px; 
            font-family: "Times New Roman", serif; 
        }
        .pdf-header-row { 
            display: flex; justify-content: center; 
            margin-bottom: 10px; font-size: 18px; font-weight: bold; 
        }
        table { width: 100%; border-collapse: collapse; }
        .th-blue { background: #0070C0; color: white; border: 1px solid #000; padding: 8px; font-size: 16px; }
        .th-green { background: #70AD47; color: white; border: 1px solid #000; padding: 8px; font-size: 16px; }
        td { border: 1px solid #000; padding: 8px; font-size: 15px; text-align: center; color: black; }
        .td-name { font-weight: bold; }
        .td-qty-cell { background: #E2EFDA; font-weight: bold; }
    </style>
</head>
<body>
<div class="header-container">
    <img src="logo.png" alt="TeeGu zakaz Logo" class="main-logo">
</div>

<style>
    .header-container {
        text-align: center;
        padding: 20px 0;
        background-color: #ffffff;
        border-bottom: 2px solid #27ae60; /* Зеленая линия в стиле бренда */
        margin-bottom: 20px;
    }

    .main-logo {
        max-width: 250px; /* Оптимальный размер для экрана телефона */
        height: auto;
        display: block;
        margin: 0 auto;
    }

    /* Настройки для печати на принтере чеков */
    @media print {
        .header-container {
            border-bottom: 1px solid #000;
            padding: 10px 0;
        }
        .main-logo {
            max-width: 200px; /* Чуть меньше для узкой чековой ленты */
            filter: grayscale(100%); /* Делаем логотип черно-белым для принтера */
        }
    }

    /* Адаптация для маленьких экранов */
    @media (max-width: 480px) {
        .main-logo {
            max-width: 180px;
        }
    }
</style>

<div class="header">
    <select id="shop" class="shop-select">
        <option>Аския Бозор</option>
        <option>Эко Бозор</option>
        <option>Сергили Бозор</option>
        <option>Сергили Ярмарка</option>
    </select>
    <input type="text" id="search" class="search-box" placeholder="Қидириш..." oninput="filterRows()">
</div>

<div id="mainList"></div>

<div id="pdf-template">
    <div class="pdf-header-row">
        <span id="pdf-shop-name"></span> &nbsp;  &nbsp;
    </div>
    <table>
        <thead>
            <tr>
                <th class="th-blue" style="width: 45px;">№</th>
                <th class="th-blue">Салаты</th>
                <th class="th-green" style="width: 130px;">Количество</th>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
    </table>
</div>

<div class="footer">
    <button class="btn-send" id="btn" onclick="sendOrder()">ТЕЛЕГРАМГА ЮБОРИШ</button>
</div>

<script>
    const BOT_TOKEN = '8691293032:AAGikZsTLffxhHo3_RVCRK3Ol7--oXPIaF8'; 
    const CHAT_ID = '483325961'; 

    // Сиз хоҳлаган тартибдаги рўйхат
    const salats = [
        "Ашланфу", "Баклажан перец жареный", "Баклажаны кабачки", "Баклажаны маринованные", "Баклажаны соте", "Баклажаны сухие", "Винегрет", "Витаминка", "Грибное ассорти", "Грибы древесные", "Грибы жареные", "Грибы маринованные", "Грибы шампиньоны", "Грибы шитаки", "Капуста сладкая", "Кочи нипи", "Креветки", "Лечо", "Марковча", "Марковча не крашенная", "Маш", "Морская капуста", "Огурцы", "Перец жареный", "Свёкла", "Соя мясо", "Спаржа", "Стрелки", "Тиби", "Тофу салат", "Фаршированный перец", "Фунчоза", "Хе куриное", "Хе мясное", "Хе рыба", "Хе три буха", "Галовка капуста", "Шпинат", "Армянский капуста", "Дайкон маринованный", "Дайкон салат", "Зверобой", "Капуста кимчи", "Квашеная капуста сладкая", "Маринованный огурцы", "Маринованный помидор", "Редиска чимчи", "Солёные ассорти", "Солёные огурцы", "Солёные памидор", "Чеснок маринованный", "Чимчи", "Женский каприз", "Крабовые", "Мужской каприз", "Оливье", "Чартоги", "Варенка", "Горчица", "Лозижон", "Маченка", "Нори Большой", "Нори Маленький", "Пигodя крахмальные", "Пигodя рисовый", "Спаржа сухая", "Халапено", "Тирой", "Борсик йог", "Гоз йог", "Цяй жареный", "Уксус", "Фунчоза сухая", "Чинпени", "Чипс", "Кукси", "Малосольные огурцы"
    ];

    function renderList() {
        const container = document.getElementById('mainList');
        // .sort() олиб ташланди, рўйхат қандай бўлса шундай чиқади
        container.innerHTML = salats.map((name, i) => `
            <div class="row" data-n="${name.toLowerCase()}">
                <div class="name">${name}</div>
                <div class="inputs">
                    <input type="number" id="q-${i}" class="q-in" placeholder="0" inputmode="decimal">
                    <select id="u-${i}">
                        <option>кг</option>
                        <option>шт</option>
                        <option>ведро</option>
                    </select>
                </div>
            </div>
        `).join('');
    }

    function filterRows() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.row').forEach(r => {
            r.style.display = r.getAttribute('data-n').includes(val) ? 'flex' : 'none';
        });
    }

    async function sendOrder() {
        const btn = document.getElementById('btn');
        const shop = document.getElementById('shop').value;
        const pdfBody = document.getElementById('pdf-body');
        
        let count = 0;
        pdfBody.innerHTML = "";

        salats.forEach((name, i) => {
            let q = document.getElementById(`q-${i}`).value;
            let u = document.getElementById(`u-${i}`).value;
            if (q > 0) {
                count++;
                pdfBody.innerHTML += `
                    <tr>
                        <td>${count}</td>
                        <td class="td-name">${name}</td>
                        <td class="td-qty-cell">${q} ${u}</td>
                    </tr>`;
            }
        });

        if (count === 0) return alert("Миқдор киритинг!");

        btn.innerText = "Юборилмоқда...";
        btn.disabled = true;
        document.getElementById('pdf-shop-name').innerText = shop;

        try {
            const canvas = await html2canvas(document.getElementById('pdf-template'), { scale: 3 });
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'order.png');
                formData.append('caption', `🏢 Дўкон: ${shop}\n📅 Сана: ${new Date().toLocaleDateString()}`);

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert("Заказ юборилди!");
                    document.querySelectorAll('.q-in').forEach(el => el.value = '');
                } else {
                    alert("Хатолик юз берди.");
                }
                btn.innerText = "ТЕЛЕГРАМГА ЮБОРИШ";
                btn.disabled = false;
            }, 'image/png');
        } catch (e) {
            alert("Хатолик: " + e.message);
            btn.disabled = false;
        }
    }

    renderList();
</script>
</body>
</html>
