<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TeeGu zakaz</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* Телефондаги интерфейс */
        body { font-family: sans-serif; background: #F2F2F7; margin: 0; padding-bottom: 120px; }
        .header-container { text-align: center; padding: 8px 0; background: #fff; border-bottom: 2px solid #27ae60; }
        .sticky-header { background: #fff; padding: 8px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #ccc; }
        .shop-select, .search-box { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; font-size: 15px; font-weight: bold; box-sizing: border-box; margin-bottom: 5px; }
        .row { display: flex; align-items: center; padding: 10px; background: #fff; border-bottom: 0.5px solid #eee; }
        .name { flex: 2; font-size: 14px; font-weight: 700; }
        .inputs { flex: 1.5; display: flex; gap: 5px; justify-content: flex-end; }
        .inputs input { width: 60px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 14px; }
        .inputs select { width: 70px; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
        .footer { position: fixed; bottom: 0; width: 100%; padding: 13px; background: white; border-top: 1px solid #ccc; box-sizing: border-box; }
        .btn-send { width: 100%; background: #0088cc; color: #fff; border: none; border-radius: 15px; padding: 10px; font-size: 15px; font-weight: bold; }

        /* ТЕЛЕГРАМ РАСМИ УЧУН (КИЧИК ШРИФТ ВА ҚИЗИЛ ЗАКАЗ) */
        #pdf-template { 
            position: absolute; left: -9999px; 
            width: 850px; background: white; padding: 30px; 
            font-family: 'Times New Roman', Times, serif; 
        }
        .pdf-header { text-align: center; font-size: 24px; font-weight: bold; text-decoration: underline; margin-bottom: 15px; }
        .pdf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th { border: 1px solid #000; padding: 6px; background: #f0f0f0; font-size: 16px; font-weight: bold; }
        td { border: 1px solid #000; padding: 4px; font-size: 14px; height: 24px; color: #000; font-weight: bold; }
        .col-name { text-align: left; padding-left: 8px; width: 70%; }
        
        /* ЗАКАЗ УСТУНИ ВА ҚИЗИЛ РАНГ */
        .col-val { 
            text-align: center; 
            width: 30%; 
            font-size: 20px; 
            color: #FF0000; /* Ёрқин қизил ранг */
            font-weight: 900; 
        }
        
        .section-title { text-align: center; background: #e0e0e0; font-weight: bold; border: 1px solid #000; padding: 5px; font-size: 16px; }
    </style>
</head>
<body>

<div class="header-container"><img src="logo.png" style="max-width:140px"></div>

<div class="sticky-header">
    <select id="shop" class="shop-select">
        <option>АСКИЯ БОЗОР</option><option>ЭКО БОЗОР</option><option>СЕРГИЛИ БОЗОР</option><option>СЕРГИЛИ ЯРМАРКА</option>
    </select>
    <input type="text" id="search" class="search-box" placeholder="Қидириш..." oninput="filterRows()">
</div>

<div id="mainList"></div>

<!-- РАСМ ШАБЛОНИ -->
<div id="pdf-template">
    <div class="pdf-header" id="pdf-shop-title"></div>
    <div class="pdf-grid">
        <div>
            <table><thead><tr><th>Салаты →</th><th>Заказ</th></tr></thead><tbody id="pdf-left"></tbody></table>
        </div>
        <div>
            <table><thead><tr><th>Соления →</th><th>Заказ</th></tr></thead><tbody id="pdf-right"></tbody></table>
        </div>
    </div>
    <div style="text-align: right; margin-top: 15px; font-size: 16px; font-weight: bold;" id="pdf-date"></div>
</div>

<div class="footer">
    <button class="btn-send" id="btn" onclick="sendOrder()">ТЕЛЕГРАМГА ЮБОРИШ</button>
</div>

<script>
    const BOT_TOKEN = '8691293032:AAGikZsTLffxhHo3_RVCRK3Ol7--oXPIaF8'; 
    const CHAT_ID = '483325961'; 

    const leftCol = ["Ашланфу", "Баклажан и перец жареный", "Баклажаны и кабачки жареные", "Баклажаны маринованные", "Баклажаны соте", "Баклажаны сухие", "Винегрет", "Витаминка", "Грибное ассорти", "Грибы древесные", "Грибы жареные", "Грибы маринованные", "Грибы шампиньоны", "Грибы шитаки", "Капуста сладкая", "Кочи нипи", "Креветки", "Лечо", "Марковча", "Марковча не крашенная", "Маш", "Морская капуста", "Огурцы", "Перец жареный", "Свёкла", "Соя мясо", "Спаржа", "Стрелки", "Тиби", "Тофу салат", "Фаршированный перец", "Фунчоза", "Хе куриное", "Хе мясное", "Хе рыба", "Хе три буха", "Цветная капуста", "Шпинат"];
    
    const rightCol = [
        "Дайкон маринованный", "Дайкон салат", "Зверобой", "Капуста кимчи", "Квашеная капуста не сладкая", "Квашеная капуста сладкая", "Маринованный огурцы", "Маринованный помидор", "Редиска чимчи", "Солёные ассорти", "Солёные огурцы", "Солёные памидор", "Чеснок маринованный", "Чимчи",
        {title: "Маянез салатлар"}, "Женский каприз", "Крабовые", "Мужской каприз", "Оливье",
        {title: "П/р"}, "Варенка", "Горчица", "Лозижон", "Маченка", "Нори Большой", "Нори Маленький", "Пигодя крахмальные", "Пигодя рисовый", "Спаржа сухая", "Кукси", "Тирой", "Борсик йоги", "Гоз йоги", "Тяй жареный", "Тяй", "Фунчоза сухая", "Чартоги", "Халапено"
    ];

    function renderList() {
        const container = document.getElementById('mainList');
        let html = "";
        [...leftCol, ...rightCol].forEach((item) => {
            if(item.title) {
                html += `<div style="background:#e0e0e0; padding:10px; font-weight:bold; text-align:center; font-size:16px;">${item.title}</div>`;
            } else {
                html += `<div class="row" data-n="${item.toLowerCase()}"><div class="name">${item}</div><div class="inputs"><input type="number" id="q-${item}" placeholder="0" inputmode="decimal"><select id="u-${item}"><option>кг</option><option>шт</option><option>ведро</option></select></div></div>`;
            }
        });
        container.innerHTML = html;
    }

    function filterRows() {
        let val = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.row').forEach(r => r.style.display = r.getAttribute('data-n').includes(val) ? 'flex' : 'none');
    }

    async function sendOrder() {
        const btn = document.getElementById('btn');
        const shop = document.getElementById('shop').value;
        const leftBody = document.getElementById('pdf-left');
        const rightBody = document.getElementById('pdf-right');
        
        leftBody.innerHTML = "";
        rightBody.innerHTML = "";
        let hasOrder = false;

        leftCol.forEach(name => {
            let q = document.getElementById(`q-${name}`).value;
            let u = document.getElementById(`u-${name}`).value;
            let val = (q > 0) ? `${q} ${u}` : "";
            if(q > 0) hasOrder = true;
            leftBody.innerHTML += `<tr><td class="col-name">${name}</td><td class="col-val">${val}</td></tr>`;
        });

        rightCol.forEach(item => {
            if(item.title) {
                rightBody.innerHTML += `<tr><td colspan="2" class="section-title">${item.title}</td></tr>`;
            } else {
                let q = document.getElementById(`q-${item}`).value;
                let u = document.getElementById(`u-${item}`).value;
                let val = (q > 0) ? `${q} ${u}` : "";
                if(q > 0) hasOrder = true;
                rightBody.innerHTML += `<tr><td class="col-name">${item}</td><td class="col-val">${val}</td></tr>`;
            }
        });

        if (!hasOrder) return alert("Миқдор киритинг!");

        btn.innerText = "ЮБОРИЛМОҚДА...";
        btn.disabled = true;
        document.getElementById('pdf-shop-title').innerText = shop;
        document.getElementById('pdf-date').innerText = "Сана: " + new Date().toLocaleDateString();

        try {
            const canvas = await html2canvas(document.getElementById('pdf-template'), { scale: 2 });
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'order.png');
                formData.append('caption', `📝 Янги заказ: ${shop}`);
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                alert("Заказ юборилди!");
                location.reload();
            });
        } catch (e) {
            alert("Хатолик юз берди");
            btn.disabled = false;
        }
    }
    renderList();
</script>
</body>
</html>
